# 可选服务：docker compose -f docker-compose.yml -f docker-compose.optional.yml --profile render up -d
services:
  render:        # JS 渲染兜底（worker 经 CDP 连接），约多占 ~1GB 内存
    profiles: [render]
    image: browserless/chrome
    environment:
      # browserless v2 需要 token；配合
      # PLAYWRIGHT_CDP_URL=ws://render:3000?token=kb-render 使用（ws 直连，token 留在升级请求上）
      TOKEN: kb-render
    restart: unless-stopped

  proxy:         # TLS 反向代理（需同目录 Caddyfile 与域名）
    profiles: [proxy]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  caddy_data: {}
