name: knowledge_vault
description: "知识匣（Knowledge Vault）跨平台客户端：Android / Windows / macOS / Linux"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.0
  markdown_widget: ^2.3.2+3
  window_manager: ^0.4.3
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
